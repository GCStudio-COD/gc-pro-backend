name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/gc-project-backend
            
            # Pull latest changes from GitHub
            git pull origin master
            
            # Install any new dependencies
            npm install
            
            # Update Prisma database schema if there are changes
            npx prisma db push
            npx prisma generate
            
            # Build TypeScript to dist
            npx tsc
            
            # Restart or fresh start server with PM2
            pm2 delete all || true
            pm2 start dist/index.js --name "gc-backend"
            pm2 save
